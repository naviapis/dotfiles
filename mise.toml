# https://mise.jdx.dev/dotfiles.html
[dotfiles]
"~/.config/ghostty" = ".config/ghostty"
"~/.config/git/*" = ".config/git/*"
"~/.config/mise" = ".config/mise"
"~/.config/nvim" = ".config/nvim"
"~/.config/tmux" = ".config/tmux"
"~/.config/zsh/*" = ".config/zsh/*"
"~/.ssh/*" = ".ssh/*"
"~/.zshenv" = ".config/zsh/.zshenv"

# https://mise.jdx.dev/bootstrap/macos-defaults.html
[bootstrap.macos.dock]
tilesize = 48
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
sort_folders_first = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
automatic_capitalization = false
automatic_spelling_correction = false

# https://mise.jdx.dev/bootstrap/user.html
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.hooks.post-packages]
run = [
  "brew install --HEAD xdg-ninja",
  "brew services restart rjyo/moshi/moshi-hook",
]
